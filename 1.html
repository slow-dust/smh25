<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人设卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",system-ui}
body{
    background:#121214;
    color:#e2e2e2;
    padding:40px 20px;
    line-height:1.7;
}
.container{
    max-width:720px;
    margin:0 auto;
}
.header{
    text-align:center;
    margin-bottom:40px;
    border-bottom:1px solid #333;
    padding-bottom:24px;
}
.header h1{
    font-size:28px;
    color:#d4b896;
    letter-spacing:2px;
}
.tags{
    margin-top:12px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
}
.tag{
    padding:4px 10px;
    background:#222;
    border:1px solid #444;
    border-radius:99px;
    font-size:13px;
    color:#aaa;
}
.section{
    margin:32px 0;
}
.section h2{
    color:#c9b08f;
    font-size:20px;
    margin-bottom:16px;
    border-left:3px solid #c9b08f;
    padding-left:10px;
}
.quote-list{
    display:grid;
    gap:12px;
}
.quote-item{
    background:#1a1a1d;
    padding:16px 20px;
    border-radius:8px;
    border:1px solid #2c2c30;
    transition:0.2s;
}
.quote-item:hover{
    border-color:#55483b;
    background:#1d1d21;
}
.info-block{
    background:#1a1a1d;
    padding:20px;
    border-radius:8px;
    border:1px solid #2c2c30;
}
.footer{
    margin-top:50px;
    text-align:center;
    color:#777;
    font-size:14px;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>角色名 · incessantly</h1>
        <div class="tags">
            <span class="tag">土象摩羯</span>
            <span class="tag">ISFP</span>
            <span class="tag">19八无</span>
            <span class="tag">所属企划：雾山影B</span>
        </div>
    </div>

    <div class="section">
        <h2>角色须知</h2>
        <div class="info-block">
            <p>这里填写角色须知、设定限制、避雷事项。<br>
            例：禁止二创魔改、不要脱离人设玩梗，台词仅为本角色语境。</p>
        </div>
    </div>

    <div class="section">
        <h2>语录</h2>
        <div class="quote-list">
            <div class="quote-item">你不吃我这套吗？那我摘了。</div>
            <div class="quote-item">可以再深一点吗。</div>
            <div class="quote-item">只是口味清淡，我人并不单纯哦。</div>
            <div class="quote-item">其实我比较擅长面壁思过。</div>
            <div class="quote-item">噩梦和春梦都是我的脸吧。</div>
            <div class="quote-item">能少哭一点吗，我没有带纸的习惯。</div>
            <div class="quote-item">承蒙厚爱。</div>
        </div>
    </div>

    <div class="section">
        <h2>板评</h2>
        <div class="info-block">
            <p>放置别人对角色的评价、印象。</p>
        </div>
    </div>

    <div class="section">
        <h2>卡类 / 冠名</h2>
        <div class="info-block">
            <p>卡类型：语录卡<br>冠名：xxx</p>
        </div>
    </div>

    <div class="footer">
        <p>incessantly | 静态人设卡页面</p>
    </div>
</div>
</body>
</html>
